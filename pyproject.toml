[project]
name = "corpora-builder"
dynamic = ["version"]
description = "Build corpora deliberately — capture, triage, fetch, file, and quality-check source material"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",           # S3 API against Cloudflare R2 (the SUBSTRATE decision)
    "httpx>=0.27.0",           # fetching sources
    "python-frontmatter>=1.1", # markdown + YAML frontmatter, the files-are-truth layer
    "pyyaml>=6.0",             # frontmatter's serializer, pinned explicitly
    "rich>=13.0.0",            # terminal output — matches memopop-orchestrator
]

[project.scripts]
corpora = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    # Non-blocking by policy (see scripts/check.sh) — reported, never gating.
    "mypy>=1.10.0",
    "boto3-stubs[s3]>=1.34.0",
    "moto[s3]>=5.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Version derived from git tags, following memopop-orchestrator.
# Tags follow v0.1.0, v0.2.0, …
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on unregistered markers so a typo'd @pytest.mark.spce never passes silently.
addopts = "--strict-markers"
markers = [
    "spec(id): bind this test to a spec test ID, e.g. @pytest.mark.spec('CAPTURE-01')",
    "structural: a guard over the suite's own shape, not over code under test. Exempt from --tdd-floor: it is green from the moment the names exist, which is correct.",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Beyond memopop's defaults (E,F): import sorting, modern syntax, bugbear.
# Formatting itself stays black's job — ruff does not format here.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Deliberately NOT strict, and deliberately non-blocking. memopop-orchestrator
# runs no type checker at all; corpora-builder keeps one for the storage and
# schema layers, where silent type drift is expensive — but it reports rather
# than gates, so a red type check never blocks the loop.
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
