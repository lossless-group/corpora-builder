[project]
name = "corpora"
version = "0.0.1"
description = "Build corpora deliberately — capture, triage, fetch, file, and quality-check source material."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "boto3>=1.34",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
corpora = "corpora.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "boto3-stubs[s3]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spec(id): bind this test to a spec test ID, e.g. @pytest.mark.spec('CAPTURE-01')",
]
# Fail on unregistered markers so a typo'd @pytest.mark.spce never passes silently.
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
